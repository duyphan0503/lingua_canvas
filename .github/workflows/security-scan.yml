name: Security & Secret Scanning

on:
  push:
    branches:
      - main
      - master
      - staging
      - develop
  pull_request:
    branches:
      - main
      - master
      - staging
      - develop
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Mondays at 02:00 UTC

jobs:
  gitleaks-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Backend Dependencies (cargo-audit)
        run: |
          which cargo-audit || cargo install cargo-audit --locked
          cd server && cargo audit

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Audit Frontend Dependencies (flutter pub outdated)
        run: |
          cd app && flutter pub outdated
