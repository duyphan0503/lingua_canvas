name: CI Frontend (Flutter)

on:
  push:
    branches:
      - main
      - master
      - staging
      - develop
    paths:
      - 'app/**'
      - 'tools/serve_web.py'
      - 'tests/web/**'
      - 'deploy/web/**'
      - '.github/workflows/ci-flutter.yml'
      - '.fvmrc'
  pull_request:
    branches:
      - main
      - master
      - staging
      - develop
      - 'codex/**'
    paths:
      - 'app/**'
      - 'tools/serve_web.py'
      - 'tests/web/**'
      - 'deploy/web/**'
      - '.github/workflows/ci-flutter.yml'
      - '.fvmrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ci:
    name: Flutter Analyze, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: '.fvmrc'
          cache: true

      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies (flutter pub get)
        run: flutter pub get

      - name: Check code formatting (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code (flutter analyze)
        run: flutter analyze

      - name: Run unit and widget tests (flutter test)
        run: flutter test --coverage

      - name: Run browser storage and speech tests
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: flutter test --no-pub --platform chrome test/web/indexed_db_test.dart test/web/browser_writer_lease_test.dart test/web/browser_speech_bridge_test.dart test/web/browser_tts_test.dart test/web/browser_tts_cancellation_test.dart test/web/browser_tts_recovery_test.dart

      - name: Build web release
        run: flutter build web --no-pub --release --no-web-resources-cdn --pwa-strategy=none

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: lingua-canvas-web
          path: app/build/web/
          if-no-files-found: error

      - name: Build Linux desktop
        run: flutter build linux --release

      - name: Build Android debug APK
        run: flutter build apk --debug
